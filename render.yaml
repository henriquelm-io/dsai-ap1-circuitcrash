# Publicação no Render (spec 004-publicacao). Um push na main publica a versão nova.
services:
  - type: web
    name: circuitcrash
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # O disco do plano gratuito some a cada reinício: a carga recria o banco antes do servidor subir.
    # Se a carga falhar, o && impede o servidor de subir e o erro fica no log.
    startCommand: .venv/bin/python -m circuitcrash.dados.carga --recriar && .venv/bin/python -m circuitcrash
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: HOST
        value: 0.0.0.0
      - key: RELOAD
        value: "0"
      - key: DATABASE_URL
        value: sqlite:///circuitcrash.db
      - key: SECRET_KEY
        generateValue: true
      # Login com Google (spec 008): os valores são digitados no painel do Render e não entram no repositório.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Atrás do proxy do Render o servidor enxerga http; o retorno precisa ser o endereço https cadastrado no Google.
      - key: GOOGLE_REDIRECT_URI
        value: https://circuitcrash.onrender.com/auth/google/retorno
