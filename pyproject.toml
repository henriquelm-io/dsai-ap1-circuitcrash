[project]
name = "circuitcrash"
version = "0.1.0"
description = "Puzzle de circuitos por turnos para 4 jogadores, jogado no navegador."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.40",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.13.1",
    "ast-serialize<0.12.1",
]

[project.scripts]
circuitcrash = "circuitcrash.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circuitcrash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["circuitcrash"]
